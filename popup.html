<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Shortcuts</title>
<link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="header">
    <div class="header-left">
      <img src="icons/logo.png" alt="Back to shortcuts" class="logo" id="logoImg" title="Back to shortcuts" />
    </div>
    <div class="header-right">
      <div class="theme-picker">
        <button type="button" id="themeBtn" class="icon-btn" title="Theme">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22a10 10 0 1 1 0-20 8 8 0 0 1 8 8c0 2-1 3-3 3h-2.5a1.5 1.5 0 0 0 0 3H15a1 1 0 0 1 1 1 3 3 0 0 1-4 3Z"></path>
            <circle cx="7.5" cy="10.5" r="1"></circle>
            <circle cx="11" cy="7" r="1"></circle>
            <circle cx="15" cy="7.5" r="1"></circle>
            <circle cx="17.5" cy="11" r="1"></circle>
          </svg>
        </button>
        <div class="theme-menu" id="themeMenu" hidden>
          <button type="button" class="theme-swatch" data-theme="dark" title="Dark"></button>
          <button type="button" class="theme-swatch" data-theme="light" title="Light"></button>
          <button type="button" class="theme-swatch" data-theme="midnight" title="Midnight"></button>
          <button type="button" class="theme-swatch" data-theme="ocean" title="Ocean"></button>
          <button type="button" class="theme-swatch" data-theme="sunset" title="Sunset"></button>
          <button type="button" class="theme-swatch" data-theme="forest" title="Forest"></button>
          <button type="button" class="theme-swatch" data-theme="grape" title="Grape"></button>
          <button type="button" class="theme-swatch" data-theme="sepia" title="Sepia"></button>
        </div>
      </div>
      <button type="button" id="addSlotBtn" class="link-btn" title="Add another slot">+ Add slot</button>
    </div>
  </header>

  <button type="button" class="folder-heading" id="folderHeading" title="Rename folder" hidden></button>

  <section class="grid" id="grid" aria-label="Shortcut slots"></section>

  <footer class="footer">
    <a href="https://buymeacoffee.com/sethflora" target="_blank" rel="noopener" class="support-btn">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9h15v5a5 5 0 0 1-5 5H8a5 5 0 0 1-5-5V9z"></path>
        <path d="M18 9h1.5a2.5 2.5 0 0 1 0 5H18"></path>
        <path d="M7 3c-.5 1 -.5 1.5 0 2.5"></path>
        <path d="M11 3c-.5 1 -.5 1.5 0 2.5"></path>
      </svg>
      <span>Support the project</span>
    </a>
  </footer>

  <div class="modal-overlay" id="modalOverlay">
    <form class="modal" id="shortcutForm">
      <h2 id="modalTitle">Add shortcut</h2>
      <div class="type-tabs" id="typeTabs">
        <button type="button" class="type-tab active" id="tabShortcut" data-type="shortcut">Shortcut</button>
        <button type="button" class="type-tab" id="tabFolder" data-type="folder">Folder</button>
      </div>
      <label>
        Name
        <input type="text" id="nameInput" maxlength="40" required autocomplete="off" />
      </label>
      <label id="urlLabel">
        <span class="label-row">
          URL
          <button type="button" id="useTabBtn" class="mini-link">Use current tab</button>
        </span>
        <input type="text" id="urlInput" placeholder="example.com" autocomplete="off" />
      </label>
      <div class="modal-actions">
        <div class="modal-actions-left">
          <button type="button" id="moveOutBtn" class="btn btn-secondary" hidden>Move out</button>
          <button type="button" id="removeBtn" class="btn btn-danger" hidden>Remove</button>
        </div>
        <div class="modal-actions-right">
          <button type="button" id="cancelBtn" class="btn btn-secondary">Cancel</button>
          <button type="submit" class="btn btn-primary" id="saveBtn">Add</button>
        </div>
      </div>
    </form>
  </div>

  <script src="popup.js"></script>
</body>
</html>
